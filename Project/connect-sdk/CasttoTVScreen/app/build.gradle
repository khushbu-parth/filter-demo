plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'

}

android {
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.cast.tv.screen.mirroring.screencasting"
        minSdkVersion 19
        targetSdkVersion 33
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        resources.excludes.add("META-INF/*")
    }

}

dependencies {

    implementation 'com.guolindev.permissionx:permissionx:1.7.1'
    implementation 'com.karumi:dexter:6.2.2'
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation files('cling-core-2.1.1.jar')
    implementation files('cling-support-2.1.1.jar')
    implementation 'com.google.android.gms:play-services-cast-framework:21.2.0'
    implementation 'com.google.firebase:firebase-firestore:24.4.0'
    implementation project(path: ':CastToTvSdkModule')
    testImplementation 'junit:junit:4.+'
    implementation project(path: ':applibs')
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

//    implementation 'com.vungle:publisher-sdk-android:6.3.24'

    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.4'
    implementation 'com.github.bumptech.glide:glide:4.13.2'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.0'
    implementation 'io.reactivex.rxjava3:rxjava:3.0.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation("org.greenrobot:eventbus:3.3.1")
    implementation 'com.guolindev.permissionx:permissionx:1.7.1'
    implementation 'com.jrummyapps:android-shell:1.0.1'
    implementation 'com.nanohttpd:nanohttpd-webserver:2.1.0'
    implementation 'com.umeng.umsdk:common:9.1.0'
    implementation "org.eclipse.jetty:jetty-server:8.2.0.v20160908"
    implementation "org.eclipse.jetty:jetty-servlet:8.2.0.v20160908"
    implementation "org.eclipse.jetty:jetty-client:8.2.0.v20160908"
    implementation 'com.android.support:multidex:1.0.3'

//    Todo Firebase
    implementation platform('com.google.firebase:firebase-bom:30.4.1')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.airbnb.android:lottie:5.2.0'

//    todo screen mirror
    implementation group: 'com.google.android.gms', name: 'play-services-location', version: '21.0.1'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'org.apache.commons:commons-io:1.3.2'

}
